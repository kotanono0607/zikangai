<!-- admin.html - ユーザー管理画面（管理者専用） -->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e0e0e0, #ffffff);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h2 {
      color: #4CAF50;
      margin-bottom: 20px;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }
    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .search-box input, .search-box select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .search-box input[type="text"] {
      min-width: 250px;
      flex: 1;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .btn-secondary {
      background-color: #888;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #666;
    }
    .btn-danger {
      background-color: #dc3545;
      color: white;
    }
    .btn-danger:hover {
      background-color: #c82333;
    }
    .btn-small {
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    .user-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    .user-table th {
      background-color: #4CAF50;
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: 500;
    }
    .user-table td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }
    .user-table tr:hover {
      background-color: #f5f5f5;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .badge-active {
      background-color: #d4edda;
      color: #155724;
    }
    .badge-inactive {
      background-color: #f8d7da;
      color: #721c24;
    }
    .badge-admin {
      background-color: #fff3cd;
      color: #856404;
    }
    .badge-normal {
      background-color: #d1ecf1;
      color: #0c5460;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    .pagination button {
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      border-radius: 4px;
    }
    .pagination button:hover:not(:disabled) {
      background-color: #f0f0f0;
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .pagination .current-page {
      font-weight: 600;
      color: #4CAF50;
    }
    .no-data {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 1.1rem;
    }
    .stats {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>👥 ユーザー管理</h2>

    <!-- 統計情報 -->
    <div class="stats">
      <strong>登録ユーザー数:</strong> <?= totalCount ?>人
    </div>

    <!-- 検索・フィルタ -->
    <form action="<?= ScriptApp.getService().getUrl() ?>" method="post">
      <input type="hidden" name="action" value="userList" />
      <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
      <div class="search-box">
        <input type="text" name="search" placeholder="🔍 氏名・ID・所属で検索..." value="<?= 検索キーワード || '' ?>" />
        <select name="statusFilter">
          <option value="all" <?= (状態フィルタ === 'all') ? 'selected' : '' ?>>すべての状態</option>
          <option value="在職" <?= (状態フィルタ === '在職') ? 'selected' : '' ?>>在職</option>
          <option value="退職" <?= (状態フィルタ === '退職') ? 'selected' : '' ?>>退職</option>
        </select>
        <select name="roleFilter">
          <option value="all" <?= (権限フィルタ === 'all') ? 'selected' : '' ?>>すべての権限</option>
          <option value="管理者" <?= (権限フィルタ === '管理者') ? 'selected' : '' ?>>管理者</option>
          <option value="一般" <?= (権限フィルタ === '一般') ? 'selected' : '' ?>>一般</option>
        </select>
        <button type="submit" class="btn btn-primary">検索</button>
      </div>
    </form>

    <!-- ヘッダーアクション -->
    <div class="header-actions">
      <div style="display: flex; gap: 10px;">
        <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;">
          <input type="hidden" name="action" value="addUserForm" />
          <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
          <button type="submit" class="btn btn-primary">➕ 新規ユーザー登録</button>
        </form>

        <button type="button" class="btn btn-primary" onclick="exportCsv()">📥 CSVエクスポート</button>
        <button type="button" class="btn btn-primary" onclick="showImportDialog()">📤 CSVインポート</button>
      </div>

      <form method="get" action="<?= ScriptApp.getService().getUrl() ?>" style="display:inline;">
        <input type="hidden" name="page" value="menu" />
        <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
        <button type="submit" class="btn btn-secondary">← メニューに戻る</button>
      </form>
    </div>

    <!-- ユーザー一覧テーブル -->
    <? if (users && users.length > 0) { ?>
      <table class="user-table">
        <thead>
          <tr>
            <th>ログインID</th>
            <th>氏名</th>
            <th>所属１</th>
            <th>所属２</th>
            <th>状態</th>
            <th>権限</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <? for (var i = 0; i < users.length; i++) { ?>
            <? var user = users[i]; ?>
            <tr>
              <td><?= user.ログインID ?></td>
              <td><?= user.氏名 ?></td>
              <td><?= user.所属１ ?></td>
              <td><?= user.所属２ ?></td>
              <td>
                <span class="badge <?= user.状態 === '在職' ? 'badge-active' : 'badge-inactive' ?>">
                  <?= user.状態 ?>
                </span>
              </td>
              <td>
                <span class="badge <?= user.権限 === '管理者' ? 'badge-admin' : 'badge-normal' ?>">
                  <?= user.権限 ?>
                </span>
              </td>
              <td>
                <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;">
                  <input type="hidden" name="action" value="editUser" />
                  <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
                  <input type="hidden" name="editUserId" value="<?= user.ログインID ?>" />
                  <button type="submit" class="btn btn-primary btn-small">✏️ 編集</button>
                </form>

                <? if (user.状態 === '在職' && user.ログインID !== ログインID) { ?>
                  <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;"
                        onsubmit="return confirm('<?= user.氏名 ?>（<?= user.ログインID ?>）を退職処理しますか？\n\n※ログインできなくなります');">
                    <input type="hidden" name="action" value="retireUser" />
                    <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
                    <input type="hidden" name="retireUserId" value="<?= user.ログインID ?>" />
                    <button type="submit" class="btn btn-danger btn-small">🚫 退職処理</button>
                  </form>
                <? } ?>
              </td>
            </tr>
          <? } ?>
        </tbody>
      </table>

      <!-- ページネーション -->
      <? if (totalPages > 1) { ?>
        <div class="pagination">
          <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;">
            <input type="hidden" name="action" value="userList" />
            <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
            <input type="hidden" name="page" value="<?= Math.max(1, currentPage - 1) ?>" />
            <input type="hidden" name="search" value="<?= 検索キーワード || '' ?>" />
            <input type="hidden" name="statusFilter" value="<?= 状態フィルタ || 'all' ?>" />
            <input type="hidden" name="roleFilter" value="<?= 権限フィルタ || 'all' ?>" />
            <button type="submit" <?= currentPage === 1 ? 'disabled' : '' ?>>◀ 前へ</button>
          </form>

          <span class="current-page">
            <?= currentPage ?> / <?= totalPages ?>
          </span>

          <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;">
            <input type="hidden" name="action" value="userList" />
            <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
            <input type="hidden" name="page" value="<?= Math.min(totalPages, currentPage + 1) ?>" />
            <input type="hidden" name="search" value="<?= 検索キーワード || '' ?>" />
            <input type="hidden" name="statusFilter" value="<?= 状態フィルタ || 'all' ?>" />
            <input type="hidden" name="roleFilter" value="<?= 権限フィルタ || 'all' ?>" />
            <button type="submit" <?= currentPage === totalPages ? 'disabled' : '' ?>>次へ ▶</button>
          </form>
        </div>
      <? } ?>

    <? } else { ?>
      <div class="no-data">
        📋 該当するユーザーが見つかりません
      </div>
    <? } ?>
  </div>

  <!-- CSV インポートダイアログ -->
  <div id="importDialog" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; justify-content:center; align-items:center;">
    <div style="background:white; padding:30px; border-radius:12px; max-width:600px; width:90%;">
      <h3 style="margin-top:0; color:#4CAF50;">📤 CSVインポート</h3>
      <p style="color:#666; font-size:0.9rem; margin-bottom:20px;">
        CSV形式: ログインID,氏名,所属１,所属２,状態,権限<br>
        ※ヘッダー行は必須です<br>
        ※既存IDは更新、新規IDは追加されます（削除はされません）
      </p>
      <div style="margin-bottom:20px;">
        <label for="csvFile" style="display:block; margin-bottom:10px; font-weight:500;">CSVファイルを選択:</label>
        <input type="file" id="csvFile" accept=".csv" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;" />
      </div>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn btn-primary" onclick="importCsv()">インポート実行</button>
        <button class="btn btn-secondary" onclick="hideImportDialog()">キャンセル</button>
      </div>
      <div id="importResult" style="margin-top:20px;"></div>
    </div>
  </div>

  <script>
    var ログインID = '<?= ログインID ?>';

    // CSV エクスポート
    function exportCsv() {
      var form = document.createElement('form');
      form.method = 'post';
      form.action = '<?= ScriptApp.getService().getUrl() ?>';
      form.target = '_blank';

      var actionInput = document.createElement('input');
      actionInput.type = 'hidden';
      actionInput.name = 'action';
      actionInput.value = 'csvExport';
      form.appendChild(actionInput);

      var idInput = document.createElement('input');
      idInput.type = 'hidden';
      idInput.name = 'ログインID';
      idInput.value = ログインID;
      form.appendChild(idInput);

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }

    // CSV インポートダイアログ表示
    function showImportDialog() {
      document.getElementById('importDialog').style.display = 'flex';
      document.getElementById('importResult').innerHTML = '';
      document.getElementById('csvFile').value = '';
    }

    // CSV インポートダイアログ非表示
    function hideImportDialog() {
      document.getElementById('importDialog').style.display = 'none';
    }

    // CSV インポート実行
    function importCsv() {
      var fileInput = document.getElementById('csvFile');
      var file = fileInput.files[0];

      if (!file) {
        alert('CSVファイルを選択してください');
        return;
      }

      var reader = new FileReader();
      reader.onload = function(e) {
        var csvData = e.target.result;

        // BOM削除（もしあれば）
        if (csvData.charCodeAt(0) === 0xFEFF) {
          csvData = csvData.substring(1);
        }

        var formData = {
          action: 'csvImport',
          ログインID: ログインID,
          csvData: csvData
        };

        document.getElementById('importResult').innerHTML = '<p style="color:#666;">処理中...</p>';

        fetch('<?= ScriptApp.getService().getUrl() ?>', {
          method: 'POST',
          body: new URLSearchParams(formData)
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            var resultHtml = '<div style="background:#d4edda; color:#155724; padding:15px; border-radius:6px; white-space:pre-wrap;">';
            resultHtml += data.message;
            resultHtml += '</div>';
            document.getElementById('importResult').innerHTML = resultHtml;

            // 3秒後にページをリロード
            setTimeout(function() {
              location.reload();
            }, 3000);
          } else {
            var errorHtml = '<div style="background:#f8d7da; color:#721c24; padding:15px; border-radius:6px;">';
            errorHtml += data.message;
            errorHtml += '</div>';
            document.getElementById('importResult').innerHTML = errorHtml;
          }
        })
        .catch(error => {
          var errorHtml = '<div style="background:#f8d7da; color:#721c24; padding:15px; border-radius:6px;">';
          errorHtml += 'エラーが発生しました: ' + error;
          errorHtml += '</div>';
          document.getElementById('importResult').innerHTML = errorHtml;
        });
      };

      reader.readAsText(file, 'UTF-8');
    }
  </script>
</body>
</html>
