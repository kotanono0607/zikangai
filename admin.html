<!-- admin.html - Bootstrap 5版 ユーザー管理画面（管理者専用） -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー管理 - 時間外報告システム</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container-custom {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .header-card h2 {
      color: #16A085;
      margin-bottom: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .stats-card {
      background: linear-gradient(135deg, #e8f5f1 0%, #d5ebe6 100%);
      border-radius: 15px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      border: 2px solid #16A085;
    }

    .stats-card strong {
      color: #16A085;
      font-size: 1.1rem;
    }

    .search-card {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .action-buttons {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .btn-custom {
      border-radius: 10px;
      padding: 0.6rem 1.25rem;
      font-weight: 600;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }

    .btn-teal {
      background: linear-gradient(135deg, #16A085 0%, #1ABC9C 100%);
      color: white;
      border: none;
    }

    .btn-purple {
      background: linear-gradient(135deg, #8E44AD 0%, #9B59B6 100%);
      color: white;
      border: none;
    }

    .btn-gray {
      background: linear-gradient(135deg, #95A5A6 0%, #7F8C8D 100%);
      color: white;
      border: none;
    }

    .table-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .table-custom {
      margin-bottom: 0;
    }

    .table-custom thead {
      background: linear-gradient(135deg, #16A085 0%, #1ABC9C 100%);
      color: white;
    }

    .table-custom thead th {
      border: none;
      font-weight: 600;
      padding: 1rem;
    }

    .table-custom tbody tr {
      transition: background 0.2s;
    }

    .table-custom tbody tr:hover {
      background: #f8f9fa;
    }

    .table-custom td {
      padding: 1rem;
      vertical-align: middle;
    }

    .badge-custom {
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .badge-active {
      background: #d4edda;
      color: #155724;
    }

    .badge-inactive {
      background: #f8d7da;
      color: #721c24;
    }

    .badge-admin {
      background: #fff3cd;
      color: #856404;
    }

    .badge-normal {
      background: #d1ecf1;
      color: #0c5460;
    }

    .btn-small {
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .pagination-custom {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      background: white;
    }

    .no-data {
      text-align: center;
      padding: 3rem;
      color: #7f8c8d;
      font-size: 1.1rem;
    }

    .modal-custom .modal-content {
      border-radius: 20px;
      border: none;
    }

    .modal-custom .modal-header {
      background: linear-gradient(135deg, #16A085 0%, #1ABC9C 100%);
      color: white;
      border-radius: 20px 20px 0 0;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem 0.5rem;
      }

      .header-card {
        padding: 1.5rem;
      }

      .action-buttons {
        flex-direction: column;
      }

      .btn-custom {
        width: 100%;
        justify-content: center;
      }

      .table-responsive {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="container-custom">
    <div class="header-card">
      <h2><i class="bi bi-people-fill"></i> ユーザー管理</h2>

      <!-- 統計情報 -->
      <div class="stats-card">
        <i class="bi bi-graph-up"></i> <strong>登録ユーザー数:</strong> <?= totalCount ?>人
      </div>

      <!-- 検索・フィルタ -->
      <form action="<?= ScriptApp.getService().getUrl() ?>" method="post">
        <input type="hidden" name="action" value="userList" />
        <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
        <div class="search-card">
          <div class="row g-3">
            <div class="col-md-5">
              <input type="text" name="search" class="form-control" placeholder="🔍 氏名・ID・所属で検索..." value="<?= 検索キーワード || '' ?>" />
            </div>
            <div class="col-md-3">
              <select name="statusFilter" class="form-select">
                <option value="all" <?= (状態フィルタ === 'all') ? 'selected' : '' ?>>すべての状態</option>
                <option value="在職" <?= (状態フィルタ === '在職') ? 'selected' : '' ?>>在職</option>
                <option value="退職" <?= (状態フィルタ === '退職') ? 'selected' : '' ?>>退職</option>
              </select>
            </div>
            <div class="col-md-2">
              <select name="roleFilter" class="form-select">
                <option value="all" <?= (権限フィルタ === 'all') ? 'selected' : '' ?>>すべての権限</option>
                <option value="管理者" <?= (権限フィルタ === '管理者') ? 'selected' : '' ?>>管理者</option>
                <option value="一般" <?= (権限フィルタ === '一般') ? 'selected' : '' ?>>一般</option>
              </select>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-teal btn-custom w-100">
                <i class="bi bi-search"></i> 検索
              </button>
            </div>
          </div>
        </div>
      </form>

      <!-- アクションボタン -->
      <div class="action-buttons">
        <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;">
          <input type="hidden" name="action" value="addUserForm" />
          <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
          <button type="submit" class="btn btn-teal btn-custom">
            <i class="bi bi-person-plus-fill"></i> 新規ユーザー登録
          </button>
        </form>

        <button type="button" class="btn btn-teal btn-custom" onclick="exportCsv()">
          <i class="bi bi-download"></i> CSVエクスポート
        </button>

        <button type="button" class="btn btn-teal btn-custom" onclick="showImportDialog()">
          <i class="bi bi-upload"></i> CSVインポート
        </button>

        <button type="button" class="btn btn-purple btn-custom" onclick="generateQrPdf()">
          <i class="bi bi-qr-code"></i> QRカード一括生成
        </button>

        <form method="get" action="<?= ScriptApp.getService().getUrl() ?>" style="display:inline; margin-left: auto;">
          <input type="hidden" name="page" value="menu" />
          <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
          <button type="submit" class="btn btn-gray btn-custom">
            <i class="bi bi-house-fill"></i> メニューに戻る
          </button>
        </form>
      </div>
    </div>

    <!-- ユーザー一覧テーブル -->
    <? if (users && users.length > 0) { ?>
      <div class="table-card">
        <div class="table-responsive">
          <table class="table table-hover table-custom">
            <thead>
              <tr>
                <th>ログインID</th>
                <th>氏名</th>
                <th>所属１</th>
                <th>所属２</th>
                <th>状態</th>
                <th>権限</th>
                <th style="text-align: center;">操作</th>
              </tr>
            </thead>
            <tbody>
              <? for (var i = 0; i < users.length; i++) { ?>
                <? var user = users[i]; ?>
                <tr>
                  <td><strong><?= user.ログインID ?></strong></td>
                  <td><?= user.氏名 ?></td>
                  <td><?= user.所属１ ?></td>
                  <td><?= user.所属２ ?></td>
                  <td>
                    <span class="badge badge-custom <?= user.状態 === '在職' ? 'badge-active' : 'badge-inactive' ?>">
                      <?= user.状態 === '在職' ? '✓ 在職' : '✗ 退職' ?>
                    </span>
                  </td>
                  <td>
                    <span class="badge badge-custom <?= user.権限 === '管理者' ? 'badge-admin' : 'badge-normal' ?>">
                      <?= user.権限 === '管理者' ? '👑 管理者' : '👤 一般' ?>
                    </span>
                  </td>
                  <td style="text-align: center;">
                    <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;">
                      <input type="hidden" name="action" value="editUser" />
                      <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
                      <input type="hidden" name="editUserId" value="<?= user.ログインID ?>" />
                      <button type="submit" class="btn btn-teal btn-small">
                        <i class="bi bi-pencil-fill"></i> 編集
                      </button>
                    </form>

                    <? if (user.状態 === '在職' && user.ログインID !== ログインID) { ?>
                      <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;"
                            onsubmit="return confirm('<?= user.氏名 ?>（<?= user.ログインID ?>）を退職処理しますか？\n\n※ログインできなくなります');">
                        <input type="hidden" name="action" value="retireUser" />
                        <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
                        <input type="hidden" name="retireUserId" value="<?= user.ログインID ?>" />
                        <button type="submit" class="btn btn-danger btn-small">
                          <i class="bi bi-x-circle-fill"></i> 退職
                        </button>
                      </form>
                    <? } ?>
                  </td>
                </tr>
              <? } ?>
            </tbody>
          </table>
        </div>

        <!-- ページネーション -->
        <? if (totalPages > 1) { ?>
          <div class="pagination-custom">
            <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;">
              <input type="hidden" name="action" value="userList" />
              <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
              <input type="hidden" name="page" value="<?= Math.max(1, currentPage - 1) ?>" />
              <input type="hidden" name="search" value="<?= 検索キーワード || '' ?>" />
              <input type="hidden" name="statusFilter" value="<?= 状態フィルタ || 'all' ?>" />
              <input type="hidden" name="roleFilter" value="<?= 権限フィルタ || 'all' ?>" />
              <button type="submit" class="btn btn-teal btn-custom btn-small" <?= currentPage === 1 ? 'disabled' : '' ?>>
                <i class="bi bi-chevron-left"></i> 前へ
              </button>
            </form>

            <span style="font-weight: 600; color: #16A085; font-size: 1.1rem;">
              <?= currentPage ?> / <?= totalPages ?>
            </span>

            <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:inline;">
              <input type="hidden" name="action" value="userList" />
              <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
              <input type="hidden" name="page" value="<?= Math.min(totalPages, currentPage + 1) ?>" />
              <input type="hidden" name="search" value="<?= 検索キーワード || '' ?>" />
              <input type="hidden" name="statusFilter" value="<?= 状態フィルタ || 'all' ?>" />
              <input type="hidden" name="roleFilter" value="<?= 権限フィルタ || 'all' ?>" />
              <button type="submit" class="btn btn-teal btn-custom btn-small" <?= currentPage === totalPages ? 'disabled' : '' ?>>
                次へ <i class="bi bi-chevron-right"></i>
              </button>
            </form>
          </div>
        <? } ?>
      </div>

    <? } else { ?>
      <div class="table-card">
        <div class="no-data">
          <i class="bi bi-inbox" style="font-size: 3rem; color: #bdc3c7; margin-bottom: 1rem;"></i><br>
          該当するユーザーが見つかりません
        </div>
      </div>
    <? } ?>
  </div>

  <!-- CSV インポートモーダル -->
  <div class="modal fade modal-custom" id="importModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-upload"></i> CSVインポート</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p style="color:#666; font-size:0.9rem; margin-bottom:20px;">
            <strong>CSV形式:</strong> ログインID,氏名,所属１,所属２,状態,権限<br>
            ※ヘッダー行は必須です<br>
            ※既存IDは更新、新規IDは追加されます（削除はされません）
          </p>
          <div class="mb-3">
            <label for="csvFile" class="form-label"><strong>CSVファイルを選択:</strong></label>
            <input type="file" class="form-control" id="csvFile" accept=".csv" />
          </div>
          <div id="importResult"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-teal btn-custom" onclick="importCsv()">
            <i class="bi bi-check-circle"></i> インポート実行
          </button>
          <button type="button" class="btn btn-gray btn-custom" data-bs-dismiss="modal">
            キャンセル
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    var ログインID = '<?= ログインID ?>';
    var importModal = new bootstrap.Modal(document.getElementById('importModal'));

    // CSV エクスポート
    function exportCsv() {
      var form = document.createElement('form');
      form.method = 'post';
      form.action = '<?= ScriptApp.getService().getUrl() ?>';
      form.target = '_blank';

      var actionInput = document.createElement('input');
      actionInput.type = 'hidden';
      actionInput.name = 'action';
      actionInput.value = 'csvExport';
      form.appendChild(actionInput);

      var idInput = document.createElement('input');
      idInput.type = 'hidden';
      idInput.name = 'ログインID';
      idInput.value = ログインID;
      form.appendChild(idInput);

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }

    // CSV インポートダイアログ表示
    function showImportDialog() {
      document.getElementById('importResult').innerHTML = '';
      document.getElementById('csvFile').value = '';
      importModal.show();
    }

    // CSV インポート実行
    function importCsv() {
      var fileInput = document.getElementById('csvFile');
      var file = fileInput.files[0];

      if (!file) {
        alert('CSVファイルを選択してください');
        return;
      }

      var reader = new FileReader();
      reader.onload = function(e) {
        var csvData = e.target.result;

        // BOM削除（もしあれば）
        if (csvData.charCodeAt(0) === 0xFEFF) {
          csvData = csvData.substring(1);
        }

        var formData = {
          action: 'csvImport',
          ログインID: ログインID,
          csvData: csvData
        };

        document.getElementById('importResult').innerHTML = '<div class="alert alert-info">処理中...</div>';

        fetch('<?= ScriptApp.getService().getUrl() ?>', {
          method: 'POST',
          body: new URLSearchParams(formData)
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            document.getElementById('importResult').innerHTML =
              '<div class="alert alert-success" style="white-space:pre-wrap;">' + data.message + '</div>';
            // 3秒後にページをリロード
            setTimeout(function() {
              location.reload();
            }, 3000);
          } else {
            document.getElementById('importResult').innerHTML =
              '<div class="alert alert-danger">' + data.message + '</div>';
          }
        })
        .catch(error => {
          document.getElementById('importResult').innerHTML =
            '<div class="alert alert-danger">エラーが発生しました: ' + error + '</div>';
        });
      };

      reader.readAsText(file, 'UTF-8');
    }

    // QRカード一括生成
    function generateQrPdf() {
      if (!confirm('全ての在職ユーザーのQRカードを生成しますか？\n\n※ブラウザで新しいウィンドウが開きます')) {
        return;
      }

      var form = document.createElement('form');
      form.method = 'post';
      form.action = '<?= ScriptApp.getService().getUrl() ?>';
      form.target = '_blank';

      var actionInput = document.createElement('input');
      actionInput.type = 'hidden';
      actionInput.name = 'action';
      actionInput.value = 'generateQrPdf';
      form.appendChild(actionInput);

      var idInput = document.createElement('input');
      idInput.type = 'hidden';
      idInput.name = 'ログインID';
      idInput.value = ログインID;
      form.appendChild(idInput);

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }
  </script>
</body>
</html>
