<body>
  <div class="login-card">
    <!-- ヘッダー -->
    <div class="login-header">
      <i class="bi bi-calendar-check"></i>
      <h4>時間外報告システム</h4>
      <small>Overtime Reporting System</small>
    </div>

    <!-- ログインフォーム -->
    <div class="login-body">
      <form id="loginForm" action="<?= ScriptApp.getService().getUrl() ?>" method="post">
        <input type="hidden" name="action" value="login" />

        <div class="form-floating">
          <input type="text" class="form-control" id="user" name="user" placeholder="ログインID" required>
          <label for="user"><i class="bi bi-person-circle"></i> ログインID</label>
        </div>

        <button type="button" class="btn btn-success btn-login w-100" onclick="保存して送信()">
          <i class="bi bi-box-arrow-in-right"></i> ログイン
        </button>
      </form>

      <!-- 区切り線 -->
      <div class="qr-login-divider">
        <span>または</span>
      </div>

      <!-- QRログイン案内 -->
      <div class="qr-info">
        <i class="bi bi-qr-code-scan"></i>
        <strong>QRコードでログイン</strong>
        <div class="mt-2" style="font-size: 0.85rem;">
          配布されたQRカードをスマホで読み取ると、自動的にログインできます。
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ページ読み込み時：保存済 ID があれば自動入力 → 自動ログイン
    document.addEventListener('DOMContentLoaded', () => {
      const 保存済ID = localStorage.getItem('loginId');
      if (保存済ID) {
        document.getElementById('user').value = 保存済ID;
        document.getElementById('loginForm').submit();
      }
    });

    // ボタン押下時：ID を保存してフォーム送信
    function 保存して送信() {
      const 入力ID = document.getElementById('user').value.trim();
      if (入力ID) {
        localStorage.setItem('loginId', 入力ID);
        document.getElementById('loginForm').submit();
      }
    }
  </script>
</body>
</html>
