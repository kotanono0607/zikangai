  <script>
    /**
     * 数値を整数部と小数部に分割して返す
     */
    function 分割する(num){
      var v = parseFloat(num) || 0;
      var 整数 = Math.floor(v);
      var 小数 = (v - 整数).toFixed(2);
      return { 整数: 整数, 小数: 小数 };
    }

    /**
     * セレクト要素へオプションを動的生成
     */
    function オプション生成(select, min, max, step){
      for(let i = min; i <= max; i += step){
        const opt = document.createElement('option');
        opt.value = i.toFixed(2);
        opt.textContent = (step === 1)
          ? String(i)
          : i.toFixed(2).replace('0','');
        select.appendChild(opt);
      }
    }

    /**
     * 2つの select から数値を合算し targetHidden へ格納して返す
     */
    function 計算値(intId, decId, hiddenId){
      const iv = parseInt(document.getElementById(intId).value, 10);
      const dv = parseFloat(document.getElementById(decId).value);
      const 合計 = iv + dv;
      document.getElementById(hiddenId).value = 合計.toFixed(2);
      return 合計;
    }

    /**
     * 合計を計算して表示＆hidden に格納
     */
    function 更新する(){
      let ot = 計算値('ot_int','ot_dec','時間外_hidden');
      let cm = 計算値('cm_int','cm_dec','振替時間_hidden');
      // 上限200時間でクランプ
      if(ot > 200){ ot = 200; document.getElementById('ot_int').value='200'; document.getElementById('ot_dec').value='00'; }
      if(cm > 200){ cm = 200; document.getElementById('cm_int').value='200'; document.getElementById('cm_dec').value='00'; }
      let service = ot - cm;
      if(service > 200) service = 200;
      if(service < 0) service = 0;
      document.getElementById('serviceTime').textContent = service.toFixed(2);
    }

    /**
     * 戻るボタン：隠しフォームを submit して select 画面へ遷移
     */
    function 戻る(){
      document.getElementById('戻るフォーム').submit();
    }

    function 送信確認(){
      const 時間外 = document.getElementById('時間外_hidden').value;
      const 振替時間 = document.getElementById('振替時間_hidden').value;
      const 年月 = "<?= 選択年月 ?>";
      const メッセージ = 年月 + " のデータを保存しますか？\n\n時間外: " + 時間外 + "時間\n業務命令: " + 振替時間 + "時間";
      return confirm(メッセージ);
    }

    // ページロード時に実行
    window.addEventListener('DOMContentLoaded', () => {
      const otInt = document.getElementById('ot_int');
      const otDec = document.getElementById('ot_dec');
      const cmInt = document.getElementById('cm_int');
      const cmDec = document.getElementById('cm_dec');

      オプション生成(otInt, 0, 200, 1);
      オプション生成(cmInt, 0, 200, 1);
      オプション生成(otDec, 0, 0.75, 0.25);
      オプション生成(cmDec, 0, 0.75, 0.25);

      const prevOT = parseFloat('<?= typeof 前回時間外 !== "undefined" && 前回時間外 !== "" ? 前回時間外 : 0 ?>');
      const prevCM = parseFloat('<?= typeof 前回振替時間 !== "undefined" && 前回振替時間 !== "" ? 前回振替時間 : 0 ?>');

      const sp1 = 分割する(prevOT);
      otInt.value = sp1.整数.toFixed(2);
      otDec.value = parseFloat(sp1.小数).toFixed(2);

      const sp2 = 分割する(prevCM);
      cmInt.value = sp2.整数.toFixed(2);
      cmDec.value = parseFloat(sp2.小数).toFixed(2);

      更新する();
      [otInt, otDec, cmInt, cmDec].forEach(el => el.addEventListener('change', 更新する));
    });
  </script>
</head>
<body>
  <div class="container-custom">
    <!-- ヘッダーカード -->
    <div class="header-card">
      <h2><i class="bi bi-clock-history"></i> 時間外入力</h2>
      <p class="user-info">
        <i class="bi bi-person-circle"></i> <strong><?= typeof 氏名 !== 'undefined' ? 氏名 : ログインID ?></strong> さん
      </p>
      <? if (typeof 選択年月 !== 'undefined') { ?>
        <p class="month-info">
          <i class="bi bi-calendar-month"></i> <?= 選択年月 ?>
        </p>
      <? } ?>
    </div>

    <!-- 注意事項 -->
    <div class="info-note">
      <i class="bi bi-info-circle-fill"></i> <strong>上限200時間</strong> - 時間外・業務命令・サービス時間すべて
    </div>

    <!-- 入力フォーム -->
    <div class="form-card">
      <form action="<?= ScriptApp.getService().getUrl() ?>" method="post">
        <input type="hidden" name="action" value="sendText" />
        <input type="hidden" name="入力ID" value="<?= ログインID ?>" />
        <input type="hidden" name="年月" value="<?= 選択年月 ?>" />

        <!-- 時間外入力 -->
        <div class="time-input-group">
          <div class="input-label">
            <i class="bi bi-clock"></i> 時間外
          </div>
          <div class="select-row">
            <div class="select-wrapper">
              <div class="select-label">時間</div>
              <select id="ot_int" aria-label="時間外 整数部"></select>
            </div>
            <span class="unit-text">時間</span>
            <div class="select-wrapper">
              <div class="select-label">分（15分単位）</div>
              <select id="ot_dec" aria-label="時間外 小数部"></select>
            </div>
            <span class="unit-text">時間</span>
          </div>
          <input type="hidden" name="時間外" id="時間外_hidden" />
        </div>

        <!-- 業務命令入力 -->
        <div class="time-input-group">
          <div class="input-label">
            <i class="bi bi-briefcase"></i> 業務命令
          </div>
          <div class="select-row">
            <div class="select-wrapper">
              <div class="select-label">時間</div>
              <select id="cm_int" aria-label="業務命令 整数部"></select>
            </div>
            <span class="unit-text">時間</span>
            <div class="select-wrapper">
              <div class="select-label">分（15分単位）</div>
              <select id="cm_dec" aria-label="業務命令 小数部"></select>
            </div>
            <span class="unit-text">時間</span>
          </div>
          <input type="hidden" name="振替時間" id="振替時間_hidden" />
        </div>

        <!-- サービス時間表示 -->
        <div class="service-time-card">
          <div class="service-time-label">
            <i class="bi bi-calculator"></i> サービス時間（時間外 - 業務命令）
          </div>
          <div>
            <span class="service-time-value" id="serviceTime">0.00</span>
            <span class="service-time-unit">時間</span>
          </div>
        </div>

        <!-- 備考入力 -->
        <div>
          <div class="remarks-label">
            <i class="bi bi-pencil-square"></i> 備考（任意）
          </div>
          <textarea
            name="備考"
            id="備考"
            class="remarks-textarea"
            placeholder="例: プロジェクトA対応、納期対応など"><?= typeof 選択年月 !== 'undefined' && typeof options !== 'undefined' ? (options.find(function(opt) { return opt.年月 === 選択年月; }) || {}).D || '' : '' ?></textarea>
        </div>

        <!-- ボタングループ -->
        <div class="button-group">
          <button type="button" class="btn-back" onclick="戻る()">
            <i class="bi bi-arrow-left"></i> 戻る
          </button>
          <button type="submit" class="btn-submit" onclick="return 送信確認()">
            <i class="bi bi-check-circle"></i> 保存
          </button>
        </div>
      </form>
    </div>

    <!-- 戻る用フォーム：時間外報告（select画面）へPOST -->
    <form id="戻るフォーム" action="<?= ScriptApp.getService().getUrl() ?>" method="post" style="display:none;">
      <input type="hidden" name="action" value="時間外報告" />
      <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
    </form>
  </div>

  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
