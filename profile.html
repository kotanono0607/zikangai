<!-- profile.html - 所属変更画面（全ユーザー利用可） -->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e0e0e0, #ffffff);
      margin: 0;
      padding: 20px;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h2 {
      color: #4CAF50;
      margin-bottom: 20px;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }
    .info-section {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .info-row {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      font-weight: 500;
      color: #666;
      min-width: 100px;
    }
    .info-value {
      color: #333;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4CAF50;
    }
    .form-group .hint {
      font-size: 0.85rem;
      color: #888;
      margin-top: 5px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .btn-secondary {
      background-color: #888;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>👤 所属情報の変更</h2>

    <!-- ユーザー情報（変更不可） -->
    <div class="info-section">
      <h3 style="margin-top:0; font-size:1rem; color:#666;">ユーザー情報</h3>
      <div class="info-row">
        <span class="info-label">ログインID:</span>
        <span class="info-value"><?= ユーザー.ログインID ?></span>
      </div>
      <div class="info-row">
        <span class="info-label">氏名:</span>
        <span class="info-value"><?= ユーザー.氏名 ?></span>
      </div>
    </div>

    <!-- 所属変更フォーム -->
    <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" onsubmit="return confirmUpdate()">
      <input type="hidden" name="action" value="profileUpdate" />
      <input type="hidden" name="ログインID" value="<?= ログインID ?>" />

      <!-- 所属１ -->
      <div class="form-group">
        <label for="shozoku1">所属１</label>
        <select id="shozoku1" name="shozoku1" onchange="update所属2Options()" required>
          <option value="">-- 選択してください --</option>
          <? var dept1List = []; ?>
          <? for (var d1 in 所属マスタ) { dept1List.push(d1); } ?>
          <? dept1List.sort(); ?>
          <? for (var i = 0; i < dept1List.length; i++) { ?>
            <? var d1 = dept1List[i]; ?>
            <option value="<?= d1 ?>" <?= ユーザー.所属１ === d1 ? 'selected' : '' ?>>
              <?= d1 ?>
            </option>
          <? } ?>
        </select>
        <div class="hint">※所属1を選択すると所属2の選択肢が表示されます</div>
      </div>

      <!-- 所属２ -->
      <div class="form-group">
        <label for="shozoku2">所属２</label>
        <select id="shozoku2" name="shozoku2">
          <option value="">-- 所属1を選択してください --</option>
        </select>
      </div>

      <div class="form-group">
        <div class="hint">
          ℹ️ 所属情報のみ変更できます。氏名・パスワード等の変更は管理者にお問い合わせください。
        </div>
      </div>

      <!-- ボタン -->
      <div class="button-group">
        <button type="submit" class="btn btn-primary">
          💾 保存する
        </button>
        <button type="button" class="btn btn-secondary" onclick="goBack()">
          ← メニューに戻る
        </button>
      </div>
    </form>
  </div>

  <script>
    // 所属マスタデータをJavaScriptオブジェクトに変換
    var 所属マスタData = <?!= JSON.stringify(所属マスタ) ?>;
    var 現在の所属1 = '<?= ユーザー.所属１ ?>';
    var 現在の所属2 = '<?= ユーザー.所属２ ?>';

    // ページ読み込み時に所属2を初期化
    window.addEventListener('DOMContentLoaded', function() {
      if (現在の所属1) {
        update所属2Options(現在の所属2);
      }
    });

    // 所属1が変更されたら所属2の選択肢を更新
    function update所属2Options(selectedValue) {
      var 所属1 = document.getElementById('shozoku1').value;
      var 所属2Select = document.getElementById('shozoku2');

      // 所属2をクリア
      所属2Select.innerHTML = '';

      if (!所属1) {
        var defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = '-- 所属1を選択してください --';
        所属2Select.appendChild(defaultOption);
        return;
      }

      // デフォルトオプション
      var defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.textContent = '-- 選択してください --';
      所属2Select.appendChild(defaultOption);

      // 所属1に対応する所属2のリストを取得
      var dept2List = 所属マスタData[所属1] || [];

      for (var i = 0; i < dept2List.length; i++) {
        var option = document.createElement('option');
        option.value = dept2List[i];
        option.textContent = dept2List[i];

        // 初期値またはパラメータで指定された値を選択
        if (selectedValue && dept2List[i] === selectedValue) {
          option.selected = true;
        }

        所属2Select.appendChild(option);
      }
    }

    function confirmUpdate() {
      var shozoku1 = document.getElementById('shozoku1').value.trim();
      var shozoku2 = document.getElementById('shozoku2').value.trim();

      if (!shozoku1) {
        alert('所属１を選択してください');
        return false;
      }

      return confirm('所属情報を変更しますか？\n\n所属１: ' + shozoku1 + '\n所属２: ' + shozoku2);
    }

    function goBack() {
      var form = document.createElement('form');
      form.method = 'get';
      form.action = '<?= ScriptApp.getService().getUrl() ?>';

      var pageInput = document.createElement('input');
      pageInput.type = 'hidden';
      pageInput.name = 'page';
      pageInput.value = 'menu';
      form.appendChild(pageInput);

      var idInput = document.createElement('input');
      idInput.type = 'hidden';
      idInput.name = 'ログインID';
      idInput.value = '<?= ログインID ?>';
      form.appendChild(idInput);

      document.body.appendChild(form);
      form.submit();
    }
  </script>
</body>
</html>
