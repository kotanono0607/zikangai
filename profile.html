<!-- profile.html - 所属変更画面（全ユーザー利用可） -->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e0e0e0, #ffffff);
      margin: 0;
      padding: 20px;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h2 {
      color: #4CAF50;
      margin-bottom: 20px;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }
    .info-section {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .info-row {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      font-weight: 500;
      color: #666;
      min-width: 100px;
    }
    .info-value {
      color: #333;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: #4CAF50;
    }
    .form-group .hint {
      font-size: 0.85rem;
      color: #888;
      margin-top: 5px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .btn-secondary {
      background-color: #888;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>👤 所属情報の変更</h2>

    <!-- ユーザー情報（変更不可） -->
    <div class="info-section">
      <h3 style="margin-top:0; font-size:1rem; color:#666;">ユーザー情報</h3>
      <div class="info-row">
        <span class="info-label">ログインID:</span>
        <span class="info-value"><?= ユーザー.ログインID ?></span>
      </div>
      <div class="info-row">
        <span class="info-label">氏名:</span>
        <span class="info-value"><?= ユーザー.氏名 ?></span>
      </div>
    </div>

    <!-- 所属変更フォーム -->
    <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" onsubmit="return confirmUpdate()">
      <input type="hidden" name="action" value="profileUpdate" />
      <input type="hidden" name="ログインID" value="<?= ログインID ?>" />

      <!-- 所属１ -->
      <div class="form-group">
        <label for="shozoku1">所属１</label>
        <input
          type="text"
          id="shozoku1"
          name="shozoku1"
          value="<?= ユーザー.所属１ ?>"
          placeholder="例: 総務課"
          required
        />
      </div>

      <!-- 所属２ -->
      <div class="form-group">
        <label for="shozoku2">所属２</label>
        <input
          type="text"
          id="shozoku2"
          name="shozoku2"
          value="<?= ユーザー.所属２ ?>"
          placeholder="例: 庶務係"
        />
      </div>

      <div class="form-group">
        <div class="hint">
          ℹ️ 所属情報のみ変更できます。氏名・パスワード等の変更は管理者にお問い合わせください。
        </div>
      </div>

      <!-- ボタン -->
      <div class="button-group">
        <button type="submit" class="btn btn-primary">
          💾 保存する
        </button>
        <button type="button" class="btn btn-secondary" onclick="goBack()">
          ← メニューに戻る
        </button>
      </div>
    </form>
  </div>

  <script>
    function confirmUpdate() {
      var shozoku1 = document.getElementById('shozoku1').value.trim();
      var shozoku2 = document.getElementById('shozoku2').value.trim();

      if (!shozoku1) {
        alert('所属１を入力してください');
        return false;
      }

      return confirm('所属情報を変更しますか？\n\n所属１: ' + shozoku1 + '\n所属２: ' + shozoku2);
    }

    function goBack() {
      var form = document.createElement('form');
      form.method = 'get';
      form.action = '<?= ScriptApp.getService().getUrl() ?>';

      var pageInput = document.createElement('input');
      pageInput.type = 'hidden';
      pageInput.name = 'page';
      pageInput.value = 'menu';
      form.appendChild(pageInput);

      var idInput = document.createElement('input');
      idInput.type = 'hidden';
      idInput.name = 'ログインID';
      idInput.value = '<?= ログインID ?>';
      form.appendChild(idInput);

      document.body.appendChild(form);
      form.submit();
    }
  </script>
</body>
</html>
