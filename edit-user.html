<!-- edit-user.html - ユーザー編集/新規登録画面 -->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e0e0e0, #ffffff);
      margin: 0;
      padding: 20px;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h2 {
      color: #4CAF50;
      margin-bottom: 20px;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4CAF50;
    }
    .form-group input[readonly] {
      background-color: #f5f5f5;
      cursor: not-allowed;
    }
    .form-group .hint {
      font-size: 0.85rem;
      color: #888;
      margin-top: 5px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .btn-secondary {
      background-color: #888;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #666;
    }
    .required {
      color: #dc3545;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><?= isNew ? '➕ 新規ユーザー登録' : '✏️ ユーザー情報編集' ?></h2>

    <form action="<?= ScriptApp.getService().getUrl() ?>" method="post" onsubmit="return validateForm()">
      <input type="hidden" name="action" value="saveUser" />
      <input type="hidden" name="ログインID" value="<?= ログインID ?>" />
      <input type="hidden" name="isNew" value="<?= isNew ?>" />

      <!-- ログインID -->
      <div class="form-group">
        <label for="userId">
          ログインID
          <? if (isNew) { ?><span class="required">*</span><? } ?>
        </label>
        <input
          type="text"
          id="userId"
          name="userId"
          value="<?= ユーザー.ログインID ?>"
          <?= isNew ? 'required' : 'readonly' ?>
        />
        <? if (!isNew) { ?>
          <div class="hint">※ログインIDは変更できません</div>
        <? } ?>
      </div>

      <!-- 氏名 -->
      <div class="form-group">
        <label for="userName">
          氏名
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="userName"
          name="userName"
          value="<?= ユーザー.氏名 ?>"
          required
          placeholder="例: 山田太郎"
        />
      </div>

      <!-- 所属１ -->
      <div class="form-group">
        <label for="shozoku1">所属１</label>
        <input
          type="text"
          id="shozoku1"
          name="shozoku1"
          value="<?= ユーザー.所属１ ?>"
          placeholder="例: 総務課"
        />
      </div>

      <!-- 所属２ -->
      <div class="form-group">
        <label for="shozoku2">所属２</label>
        <input
          type="text"
          id="shozoku2"
          name="shozoku2"
          value="<?= ユーザー.所属２ ?>"
          placeholder="例: 庶務係"
        />
      </div>

      <!-- 状態 -->
      <div class="form-group">
        <label for="status">状態</label>
        <select id="status" name="status">
          <option value="在職" <?= ユーザー.状態 === '在職' ? 'selected' : '' ?>>在職</option>
          <option value="退職" <?= ユーザー.状態 === '退職' ? 'selected' : '' ?>>退職</option>
        </select>
        <div class="hint">※退職に設定するとログインできなくなります</div>
      </div>

      <!-- 権限 -->
      <div class="form-group">
        <label for="role">権限</label>
        <select id="role" name="role">
          <option value="一般" <?= ユーザー.権限 === '一般' ? 'selected' : '' ?>>一般</option>
          <option value="管理者" <?= ユーザー.権限 === '管理者' ? 'selected' : '' ?>>管理者</option>
        </select>
        <div class="hint">※管理者はユーザー管理機能にアクセスできます</div>
      </div>

      <!-- パスワード -->
      <div class="form-group">
        <label for="userPassword">
          パスワード
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="userPassword"
          name="userPassword"
          value="<?= ユーザー.パスワード ?>"
          required
          placeholder="パスワードを入力"
        />
        <div class="hint">※変更しない場合は現在のパスワードのまま</div>
      </div>

      <!-- ボタン -->
      <div class="button-group">
        <button type="submit" class="btn btn-primary">
          <?= isNew ? '✅ 登録する' : '💾 保存する' ?>
        </button>
        <button type="button" class="btn btn-secondary" onclick="goBack()">
          ❌ キャンセル
        </button>
      </div>
    </form>
  </div>

  <script>
    function validateForm() {
      var userId = document.getElementById('userId').value.trim();
      var userName = document.getElementById('userName').value.trim();
      var password = document.getElementById('userPassword').value.trim();

      if (!userId || !userName || !password) {
        alert('必須項目を入力してください');
        return false;
      }

      <?= isNew ? '' : 'return confirm("ユーザー情報を更新しますか？");' ?>
      return true;
    }

    function goBack() {
      if (confirm('編集を中止してユーザー一覧に戻りますか？')) {
        var form = document.createElement('form');
        form.method = 'post';
        form.action = '<?= ScriptApp.getService().getUrl() ?>';

        var actionInput = document.createElement('input');
        actionInput.type = 'hidden';
        actionInput.name = 'action';
        actionInput.value = 'userList';
        form.appendChild(actionInput);

        var idInput = document.createElement('input');
        idInput.type = 'hidden';
        idInput.name = 'ログインID';
        idInput.value = '<?= ログインID ?>';
        form.appendChild(idInput);

        document.body.appendChild(form);
        form.submit();
      }
    }
  </script>
</body>
</html>
